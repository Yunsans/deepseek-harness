# τ² eval composition: jsonrpc-agent skeleton minus subagent/todo, plus
# danger-full-access and workspace AGENTS.md loading. stdout is JSON-RPC only.

- id: jsonrpc-base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../examples/jsonrpc-agent/cordis.yml
    patches:
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          includeHarnessIdentity: false
          includeRuntimeContext: false
          persona: You are a customer-service agent.
          workspaceContext:
            maxBytes: 65536
            projectRootMarkers: [AGENTS.md]
            dshHome: !!js process.env.DSH_CWD ?? process.cwd()
          skills:
            enabled: false
          toolBash:
            enableRunInBackground: false
          toolJobs: false
      - id: bash
        name: '@deepseek-ai/dsh-bash-local'
        config:
          cwd: !!js process.env.DSH_CWD ?? process.cwd()
          timeoutMs: 300000
      - id: sessions
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
          compression: none
      - id: subagent
        name: '@deepseek-ai/dsh-subagent'
        disabled: true
      - id: subagent-spawn-in-process
        name: '@deepseek-ai/dsh-subagent-spawn-in-process'
        disabled: true
      - id: tool-subagent
        name: '@deepseek-ai/dsh-tool-subagent'
        disabled: true
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        disabled: true
      - insert:
          - id: sandbox
            name: '@deepseek-ai/dsh-sandbox-local'
          - id: sandbox-policy
            name: '@deepseek-ai/dsh-sandbox-policy'
            config:
              mode: danger-full-access
              workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()
          - id: mcp-tau2
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: !!js "!process.env.DSH_TAU2_MCP_URL"
            config:
              serverName: tau2
              transport: streamable-http
              url: !!js process.env.DSH_TAU2_MCP_URL ?? 'http://127.0.0.1:1/mcp'
              failOnStartupError: true
